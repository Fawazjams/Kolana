name: Deploy to Cloud Run

# Runs after CI passes on main, or manually. Needs these repo settings:
#   secrets:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   variables: GCP_PROJECT_ID, GCP_REGION (e.g. us-central1)
# App secrets (MONGODB_URI, JWT_SECRET, GEMINI_API_KEY, ELEVENLABS_API_KEY) live in
# Secret Manager and are mounted below.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: kolana-api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kolana/kolana-api

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} backend
          docker push $IMAGE:${{ github.sha }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated --memory=2Gi --cpu=2
          secrets: |
            MONGODB_URI=MONGODB_URI:latest
            JWT_SECRET=JWT_SECRET:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest
